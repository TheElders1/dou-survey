<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOU Student Survey</title>
  <!-- App-like Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    :root { 
      --purple: #510F64; 
      --purple-light: #8B2FC9; 
      --bg: #030712; 
      --card: #111827; 
      --text: #F9FAFB; 
      --muted: #9CA3AF; 
      --border: rgba(255, 255, 255, 0.1); 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      height: 100dvh; 
      overflow: hidden; 
      background-image: radial-gradient(circle at 0% 0%, rgba(81, 15, 100, 0.15) 0%, transparent 50%);
    }
    .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: 1.5rem; transition: 0.3s; }
    .screen.active { display: flex; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-top: env(safe-area-inset-top); }
    .q-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; line-height: 1.1; letter-spacing: -0.02em; }
    .q-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem; }
    .options-list { display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; padding-bottom: 120px; }
    .option-btn { background: var(--card); border: 1px solid var(--border); padding: 1.2rem; border-radius: 18px; color: var(--text); display: flex; align-items: center; gap: 1rem; font-size: 1rem; font-weight: 600; text-align: left; transition: 0.2s; }
    .option-btn:active { transform: scale(0.96); background: rgba(139, 47, 201, 0.1); }
    .option-btn.selected { border-color: var(--purple-light); background: rgba(139, 47, 201, 0.15); box-shadow: 0 0 15px rgba(139, 47, 201, 0.2); }
    .text-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 1.2rem; color: var(--text); font-family: inherit; font-size: 1rem; min-height: 120px; outline: none; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 1.5rem calc(1.5rem + env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 40%); display: flex; gap: 0.8rem; }
    .btn { flex: 1; height: 60px; border-radius: 18px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .btn-next { background: var(--purple); color: white; box-shadow: 0 4px 15px rgba(81, 15, 100, 0.4); }
    .btn-next:disabled { opacity: 0.4; }
    .btn-back { background: var(--card); color: var(--muted); flex: 0.4; border: 1px solid var(--border); }
    .progress { height: 6px; background: var(--border); border-radius: 10px; margin-bottom: 2rem; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--purple-light)); border-radius: 10px; transition: 0.4s; }
    .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .count-badge { background: rgba(139, 47, 201, 0.1); color: var(--purple-light); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; margin-bottom: 1rem; border: 1px solid rgba(139, 47, 201, 0.2); }
  </style>
</head>
<body>

  <!-- LANDING -->
  <section id="landing" class="screen active">
    <div class="hero">
      <div id="badgeArea"><span class="count-badge">Checking votes...</span></div>
      <h1 class="q-title" style="font-size: 2.5rem;">Pick the next <span style="color:var(--purple-light)">DOU</span> App</h1>
      <p class="q-sub">Built by students, for students. Your vote decides what we develop next for Dennis Osadabey University.</p>
      <button class="btn btn-next" onclick="start()">Start Survey →</button>
    </div>
  </section>

  <!-- SURVEY -->
  <section id="survey" class="screen">
    <div class="header">
      <span style="font-weight:800; color:var(--purple-light)">DOU Studio</span>
      <span id="stepTxt" style="font-size:0.8rem; font-weight:700; color:var(--muted)">1/5</span>
    </div>
    <div class="progress"><div id="pFill" class="progress-fill" style="width: 20%;"></div></div>
    <div id="qArea"></div>
    <div class="nav-bar">
      <button id="bBtn" class="btn btn-back" onclick="prev()">Back</button>
      <button id="nBtn" class="btn btn-next" onclick="next()">Next</button>
    </div>
  </section>

  <!-- SUCCESS -->
  <section id="thanks" class="screen">
    <div class="hero">
      <div style="font-size: 4rem; margin-bottom: 1rem;">🚀</div>
      <h1 class="q-title">Vote Recorded!</h1>
      <p class="q-sub">Thanks for participating. We're analyzing the data to start building the most requested app.</p>
      <button class="btn btn-next" onclick="location.reload()">Finish</button>
    </div>
  </section>

  <script>
    // --- YOUR LIVE DATABASE LINK ---
    const DB_URL = 'https://script.google.com/macros/s/AKfycbxJOFx17UvGldGJL8CKUMUQVtw-XJSKZlGXVqpzTykHxe8RA3Li832rJAKc5250iz14eg/exec'; 

    const questions = [
      { id: 'choice', type: 'single', q: 'Which app do you need most?', sub: 'Pick your top priority.', options: [{e:'📚', t:'CBT Exam Practice'}, {e:'🍽️', t:'Canteen Pre-order'}, {e:'📅', t:'Timetable Tracker'}, {e:'🏠', t:'Hostel Finder'}] },
      { id: 'dept', type: 'single', q: 'Your Department?', sub: 'Helps us tailor the features.', options: [{e:'💻', t:'Comp Sci'}, {e:'🔐', t:'Cyber Security'}, {e:'📊', t:'Data Science'}, {e:'⚙️', t:'Software Eng.'}, {e:'🏫', t:'Other'}] },
      { id: 'pay', type: 'single', q: 'Would you pay for it?', sub: 'Honesty helps our pricing.', options: [{e:'💰', t:'Yes, if affordable'}, {e:'💭', t:'Maybe'}, {e:'🆓', t:'No, free only'}] },
      { id: 'pain', type: 'single', q: 'Biggest pain point?', sub: 'What stresses you most?', options: [{e:'😰', t:'Lack of past questions'}, {e:'😵', t:'Missing classes'}, {e:'💸', t:'Money management'}, {e:'🍛', t:'Food queues'}] },
      { id: 'idea', type: 'text', q: 'Any other app idea?', sub: 'Optional: What else is missing?', placeholder: 'I wish there was an app for...' }
    ];

    let step = 0; 
    let answers = {};

    // Get live vote count from Google Sheets
    async function getCount() {
      try {
        const r = await fetch(DB_URL);
        const d = await r.json();
        document.getElementById('badgeArea').innerHTML = `<span class="count-badge">${d.total} Students Voted Already</span>`;
      } catch(e) { 
        document.getElementById('badgeArea').innerHTML = `<span class="count-badge">Join the community vote</span>`; 
      }
    }

    function start() { 
      document.getElementById('landing').classList.remove('active'); 
      document.getElementById('survey').classList.add('active'); 
      render(); 
    }

    function render() {
      const q = questions[step];
      const area = document.getElementById('qArea');
      document.getElementById('pFill').style.width = ((step+1)/questions.length)*100 + '%';
      document.getElementById('stepTxt').innerText = (step+1) + ' / ' + questions.length;
      document.getElementById('bBtn').style.visibility = step === 0 ? 'hidden' : 'visible';
      document.getElementById('nBtn').innerText = step === questions.length - 1 ? 'Finish 🎉' : 'Next';

      let html = `<h1 class="q-title">${q.q}</h1><p class="q-sub">${q.sub}</p>`;
      if(q.type === 'single') {
        html += `<div class="options-list">`;
        q.options.forEach(o => {
          const sel = answers[q.id] === o.t ? 'selected' : '';
          html += `<button class="option-btn ${sel}" onclick="pick('${q.id}','${o.t}')"><span>${o.e}</span><span>${o.t}</span></button>`;
        });
        html += `</div>`;
      } else {
        html += `<textarea id="textIn" class="text-input" placeholder="${q.placeholder}" oninput="answers['${q.id}']=this.value">${answers[q.id]||''}</textarea>`;
      }
      area.innerHTML = html;
      document.getElementById('nBtn').disabled = q.type === 'single' && !answers[q.id];
    }

    function pick(id, val) { 
      answers[id] = val; 
      render(); 
      // Auto-advance
      setTimeout(() => { if(step < questions.length - 1) next(); }, 400); 
    }

    function next() { 
      if(step < questions.length - 1) { 
        step++; render(); 
      } else { 
        submit(); 
      } 
    }

    function prev() { 
      if(step > 0) { step--; render(); } 
    }

    async function submit() {
      document.getElementById('survey').classList.remove('active');
      document.getElementById('thanks').classList.add('active');
      
      // Submit to Google Sheets
      fetch(DB_URL, { 
        method: 'POST', 
        mode: 'no-cors', 
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(answers) 
      });
    }

    window.onload = getCount;
  </script>
</body>
</html>
